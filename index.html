<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div class="logo">
          <span class="logo-icon"></span>
          <h2>SpendWise</h2>
          <i class="fa-solid fa-gem"></i>
        </div>

        <div class="header-info">
          <span id="current-date">Daily Expense Tracker</span>
        </div>
      </header>

      <section class="welcome-section">
        <div>
          <h1>Expense Overview</h1>
          <p>Track your spending and stay in control of your money.</p>
        </div>
      </section>

      <section class="summary-section">
        <div class="summary-card total-card">
          <p>Total Spent Today</p>
          <h2 id="daily-total">KES 0.00</h2>
          <span>Your daily spending</span>
        </div>

        <div class="summary-card">
          <p>Total Transactions</p>
          <h2 id="expense-count">0</h2>
          <span>Recorded expenses</span>
        </div>
      </section>

      <section class="expense-form-section">
        <div class="section-heading">
          <h2>Add New Expense</h2>
          <p>Record a new transaction below.</p>
        </div>

        <form id="expense-form">
          <div class="form-group">
            <label for="description">Expense Description</label>
            <input
              type="text"
              id="description"
              placeholder="e.g. Lunch,Shopping"
              required
            />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="amount">Amount (KES)</label>
              <input
                type="number"
                id="amount"
                placeholder="e.g. 500"
                min="0.01"
                required
              />
            </div>

            <div class="form-group">
              <label for="category">Category</label>
              <select id="category" required>
                <option value="">Select Category</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Shopping">Shopping</option>
                <option value="Bills">Bills</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="expense-date">Expense Date</label>
            <input type="date" id="expense-date" required />
          </div>

          <button type="submit" id="add-expense-btn">Add Expense</button>
        </form>
      </section>
    </div>
  </body>
</html>
